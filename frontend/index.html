<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon" rel="icon" type="image/svg+xml" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Citas Médicas - MediCitas</title>
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('load', function() {
        var styles = getComputedStyle(document.documentElement);
        var fromPrimary = styles.getPropertyValue('--primary').trim();
        var fromScale = styles.getPropertyValue('--color-primary-500').trim();
        var color = fromPrimary || fromScale || '#10b981';
        var bg = styles.getPropertyValue('--surface').trim() || '#ffffff';
        var stroke = styles.getPropertyValue('--border').trim() || '#e2e8f0';
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">\
<rect x="4" y="4" width="56" height="56" rx="12" fill="'+bg+'" stroke="'+stroke+'" stroke-width="2"/>\
<text x="32" y="40" fill="'+color+'" font-size="36" font-weight="700" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">M</text>\
</svg>';
        var url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        var link = document.getElementById('favicon');
        if (link) link.setAttribute('href', url);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
