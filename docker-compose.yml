services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - LOGISTICS_URL=http://logistics-service:8081
      - SERVICE_API_KEY=${SERVICE_API_KEY:-admin-agent-key}
    ports:
      - "8000:8000"
    networks:
      - farmacia_net

  frontend:
    build: ./frontend
    environment:
      - VITE_BACKEND_ORIGIN=http://localhost:8000
      - VITE_GROQ_MODEL=llama-3.1-8b-instant
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - farmacia_net

  logistics-service:
    build: ./microservices/logistics-service
    environment:
      - BACKEND_URL=http://backend:8000/api
      - SERVICE_API_KEY=${SERVICE_API_KEY:-admin-agent-key}
    ports:
      - "8081:8081"
    depends_on:
      - backend
  offers-service:
    build: ./microservices/offers-service
    environment:
      - BACKEND_URL=http://backend:8000/api
      - SERVICE_API_KEY=${SERVICE_API_KEY:-admin-agent-key}
      - OFFERS_CRON=0 */1 * * * *
    ports:
      - "8091:8091"
    depends_on:
      - backend
    networks:
      - farmacia_net

  stripe-listen:
    image: stripe/stripe-cli:latest
    command: >-
      listen --forward-to http://backend:8000/api/ecommerce/webhooks/stripe/
      --events payment_intent.succeeded,payment_intent.payment_failed
    environment:
      - STRIPE_API_KEY=${STRIPE_API_KEY}
    depends_on:
      - backend
    networks:
      - farmacia_net

networks:
  farmacia_net:
    driver: bridge
